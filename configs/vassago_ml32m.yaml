# VASSAGO Production Model Configuration (MovieLens-32M)
model:
  name: VASSAGO
  architecture: Continuous Temporal Decay Backbone with Contextual Evidence Head
  dimension: 64
  heads: 4
  layers: 2
  max_length: 200
  dropout: 0.2
  ffn_dim: 64
  temporal_decay:
    type: parametric_continuous
    log_gamma_init: [-3.0, -2.3, -1.6, -0.7]
    tau_seconds: 60.0  # 60.0 s (1.0 minute reference scale)
  contextual_head:
    memory_window: 8
    context_dimension: 32
    temperature: 0.1
    residual_scale_beta: 0.50

training:
  dataset: MovieLens-32M
  sequences_path: data/processed/ml32m-global-temporal-v4/hstu_training_sequences.csv
  catalog_path: data/processed/ml32m-global-temporal-v4/catalog.json
  total_sequences: 170463
  catalog_items: 87585
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  backbone_epochs: 35
  context_epochs: 10
  negatives_per_sequence: 256
  logit_scale: 12.0
  debiasing:
    type: inverse_frequency_regularization
    alpha: 0.02
    scope: training_objective_only
    inference_adjustment: none

serving:
  tiling_chunk_size: 8192
  precision: bfloat16
  full_catalog_ranking: true
  candidate_count: 87585
  seen_item_masking: true
  p95_latency_ms: 2.99
  peak_vram_mb: 217.29
