[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vassago-rank"
version = "0.1.0"
description = "VASSAGO: Variable-decay Attention with Short-span State Attribution for Global-catalog Ordering"
authors = [
    { name = "Jorge Mendes" },
]
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "polars>=1.30,<2", "pyarrow>=19,<24", "pydantic>=2.10,<3", "pyyaml>=6,<7", "safetensors>=0.5,<1"]

[project.optional-dependencies]
text = ["sentence-transformers>=3.4,<6"]
ann = ["faiss-cpu>=1.10,<2"]
analysis = [
    "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "pre-commit>=4,<5"]

[project.scripts]
vassago = "vassago.cli:main"

[tool.hatch.build]
exclude = ["/.venv*", "/artifacts", "/data/processed", "/data/raw", "/reports"]

[tool.hatch.build.targets.wheel]
packages = ["src/vassago"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
